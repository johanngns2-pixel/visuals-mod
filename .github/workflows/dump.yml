name: dump
on:
  push:
    branches: [dump]
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: chmod +x gradlew && ./gradlew build --stacktrace
      - name: Signaturen auslesen
        run: |
          mkdir -p /tmp/out
          MC=$(find . ~/.gradle -name "minecraft-merged-*.jar" 2>/dev/null | grep -v sources | head -1)
          for c in 'net.minecraft.client.particle.SingleQuadParticle$Layer' 'net.minecraft.client.particle.SingleQuadParticle$FacingCameraMode' 'net.minecraft.client.particle.ParticleRenderType' 'net.minecraft.client.renderer.state.QuadParticleRenderState' 'net.minecraft.client.particle.SpriteSet' 'net.minecraft.client.particle.ParticleResources' 'net.minecraft.core.particles.SimpleParticleType' 'net.minecraft.core.particles.ParticleType' 'net.minecraft.core.Direction' 'net.minecraft.world.level.block.state.BlockBehaviour$BlockStateBase' 'net.minecraft.world.level.BlockGetter' 'net.minecraft.client.renderer.LevelRenderer' 'net.minecraft.client.renderer.WeatherEffectRenderer' 'net.minecraft.client.renderer.state.WeatherRenderState' 'net.minecraft.client.renderer.fog.environment.AtmosphericFogEnvironment' 'net.minecraft.client.renderer.fog.FogRenderer' 'net.minecraft.client.renderer.fog.FogData' 'net.minecraft.util.Mth'; do
            javap -p -cp "$MC" "$c" >> /tmp/out/inner.txt 2>&1 || true
          done
          for j in $(find ~/.gradle -name "fabric-particles-v1*.jar" -o -name "fabric-particle-api*.jar" -o -name "fabric-rendering-v1*.jar" 2>/dev/null | grep -v -E "sources|javadoc"); do echo "== $j" >> /tmp/out/fabric.txt; unzip -l "$j" | awk '{print $4}' | grep -E "Particle|WorldRender|Fog|Sky|Weather" >> /tmp/out/fabric.txt; done
          for j in $(find ~/.gradle -name "fabric-particles-v1*.jar" -o -name "fabric-particle-api*.jar" 2>/dev/null | grep -v -E "sources|javadoc" | head -2); do
            for c in net.fabricmc.fabric.api.client.particle.v1.ParticleFactoryRegistry 'net.fabricmc.fabric.api.client.particle.v1.ParticleFactoryRegistry$PendingParticleFactory' net.fabricmc.fabric.api.client.particle.v1.FabricSpriteProvider net.fabricmc.fabric.api.particle.v1.FabricParticleTypes; do
              javap -p -cp "$j" "$c" >> /tmp/out/fabric-sigs.txt 2>&1 || true
            done
          done
      - name: Auf Branch mc-sigs2 ablegen
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan mc-sigs2
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/out/* .
          git add -A
          git commit -m "Signaturen 2"
          git push -f origin mc-sigs2
