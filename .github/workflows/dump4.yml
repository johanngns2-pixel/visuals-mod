name: dump4
on:
  push:
    branches: [dump4]
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: chmod +x gradlew && ./gradlew build --stacktrace
      - name: Auslesen
        run: |
          mkdir -p /tmp/out
          MC=$(find . ~/.gradle -name "minecraft-merged-*.jar" 2>/dev/null | grep -v sources | head -1)
          for c in net.minecraft.client.Camera net.minecraft.client.renderer.entity.EntityRenderer net.minecraft.client.renderer.entity.LivingEntityRenderer net.minecraft.client.renderer.entity.player.AvatarRenderer net.minecraft.client.CameraType net.minecraft.client.sounds.MusicManager net.minecraft.sounds.Music net.minecraft.sounds.Musics com.mojang.blaze3d.pipeline.RenderTarget com.mojang.blaze3d.opengl.GlTexture com.mojang.blaze3d.opengl.GlStateManager com.mojang.blaze3d.textures.GpuTexture net.minecraft.client.renderer.entity.layers.EquipmentLayerRenderer net.minecraft.client.resources.model.EquipmentClientInfo; do
            javap -p -cp "$MC" "$c" >> /tmp/out/sigs4.txt 2>&1 || true
          done
          javap -p -c -cp "$MC" net.minecraft.client.renderer.entity.layers.EquipmentLayerRenderer > /tmp/out/equip-bytecode.txt 2>&1 || true
          javap -p -c -cp "$MC" net.minecraft.client.renderer.entity.EntityRenderer | grep -B2 -A30 "shouldShowName" | head -80 > /tmp/out/entityrenderer-bytecode.txt 2>&1 || true
          for j in $(find ~/.gradle -name "fabric-rendering-v1*.jar" 2>/dev/null | grep -v -E "sources|javadoc" | head -1); do
            unzip -l "$j" | awk '{print $4}' | grep -i hud > /tmp/out/fabric-hud-classes.txt || true
            for c in net.fabricmc.fabric.api.client.rendering.v1.hud.VanillaHudElements net.fabricmc.fabric.api.client.rendering.v1.hud.HudElementRegistry net.fabricmc.fabric.api.client.rendering.v1.hud.HudElement; do javap -p -cp "$j" "$c" >> /tmp/out/fabric-hud.txt 2>&1 || true; done
          done
      - name: Ablegen
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan mc-sigs4
          git rm -rf . >/dev/null 2>&1 || true
          cp -r /tmp/out/* .
          git add -A
          git commit -m "Auslesen 4"
          git push -f origin mc-sigs4
