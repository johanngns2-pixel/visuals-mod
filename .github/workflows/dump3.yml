name: dump3
on:
  push:
    branches: [dump3]
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: chmod +x gradlew && ./gradlew build --stacktrace
      - name: Auslesen
        run: |
          mkdir -p /tmp/out/assets
          CL=$(find ~/.gradle -name "minecraft-client.jar" | head -1)
          MC=$(find . ~/.gradle -name "minecraft-merged-*.jar" 2>/dev/null | grep -v sources | head -1)
          unzip -o -q "$CL" 'assets/minecraft/post_effect/*' 'assets/minecraft/shaders/post/*' 'assets/minecraft/shaders/core/screenquad*' 'assets/minecraft/shaders/include/*' -d /tmp/out/assets 2>/dev/null || true
          find /tmp/out/assets -type f | sort > /tmp/out/files.txt
          for c in net.minecraft.client.renderer.GameRenderer net.minecraft.client.renderer.PostChain net.minecraft.client.renderer.PostPass net.minecraft.client.renderer.PostChainConfig 'net.minecraft.client.renderer.PostChainConfig$Pass' 'net.minecraft.client.renderer.PostChainConfig$Input' net.minecraft.client.renderer.LevelTargetBundle net.minecraft.client.renderer.RenderPipelines net.minecraft.client.Options; do javap -p -cp "$MC" "$c" >> /tmp/out/sigs3.txt 2>&1 || true; done
          unzip -l "$MC" | awk '{print $4}' | grep -i -E "PostChain|PostPass|post_effect|EffectInstance" > /tmp/out/postclasses.txt || true
      - name: Ablegen
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan mc-sigs3
          git rm -rf . >/dev/null 2>&1 || true
          cp -r /tmp/out/* .
          git add -A
          git commit -m "Auslesen 3"
          git push -f origin mc-sigs3
