name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee /tmp/build.log
      - name: Fehlerlog ablegen
        if: failure()
        run: |
          grep -E "error:|warning: \[|\.java:[0-9]+|symbol:|location:|FAILED|What went wrong" /tmp/build.log | head -150 > /tmp/errors.txt || true
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan build-log
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/errors.txt errors.txt
          git add errors.txt
          git commit -m "Build-Fehler"
          git push -f origin build-log
      - name: Jar hochladen
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: visuals-jar
          path: build/libs/*.jar
      - name: Release erstellen (nur bei Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true
